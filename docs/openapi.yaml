openapi: 3.1.0

info:
  title: Immera API
  version: 0.1.0

servers:
  - url: http://localhost:8080/api/v1
    description: Main API

paths:
  /users/{userID}:
    get:
      tags:
        - User
      summary: Get user by ID
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidUserID'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - User
      summary: Update user by ID
      operationId: updateUserByID
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '204':
          description: User updated successfully
        '400':
          $ref: '#/components/responses/UpdateUserBadRequest'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/UserConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{userID}/settings:
    get:
      tags:
        - User
      summary: Get user's settings by ID
      parameters:
        - name: userID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User's settings found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          $ref: '#/components/responses/InvalidUserID'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: ERROR_CODE
            message:
              type: string
              example: Human-readable error message
    User:
      type: object
      required:
        - id
        - name
        - email
        - phone_number
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string

    UserSettings:
      type: object
      required:
        - id
        - default_language
        - theme
      properties:
        id:
          type: string
          format: uuid
        default_language:
          type: string
        theme:
          type: string

    UpdateUserRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - phone_number
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          example: Jane Doe
        email:
          type: string
          format: email
          maxLength: 50
          example: jane@example.com
        phone_number:
          type: string
          minLength: 1
          maxLength: 15
          example: "+48123456789"

  responses:
    InvalidUserID:
      description: The user ID is not a valid non-zero UUID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_USER_ID
              message: invalid user id
    UpdateUserBadRequest:
      description: The user ID or request body is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidUserID:
              summary: Invalid user ID
              value:
                error:
                  code: INVALID_USER_ID
                  message: invalid user id
            invalidRequest:
              summary: Malformed request body
              value:
                error:
                  code: INVALID_REQUEST
                  message: invalid request
            invalidUserData:
              summary: Invalid user fields
              value:
                error:
                  code: INVALID_USER_DATA
                  message: invalid user data
    UserNotFound:
      description: No user exists with the provided ID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: USER_NOT_FOUND
              message: user not found
    UserConflict:
      description: The email or phone number is already used by another user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            emailAlreadyExists:
              summary: Email already exists
              value:
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: email already exists
            phoneNumberAlreadyExists:
              summary: Phone number already exists
              value:
                error:
                  code: PHONE_NUMBER_ALREADY_EXISTS
                  message: phone number already exists
            userConflict:
              summary: Another user uniqueness constraint was violated
              value:
                error:
                  code: USER_CONFLICT
                  message: user conflicts with existing data
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_REQUEST
              message: invalid request
    Unauthorized:
      description: Authentication is required or credentials are invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: authentication is required
    Forbidden:
      description: The authenticated user does not have permission to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: you do not have permission to perform this action
    NotFound:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: requested resource was not found
    Conflict:
      description: Request conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: request conflicts with the current state of the resource
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: internal server error
